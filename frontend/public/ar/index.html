<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensHive - AR Try-On (A-Frame)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      z-index: 1000;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 30px;
      border-radius: 15px;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    a-scene {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <!-- MindAR Face A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <!-- Eruda Mobile Console for debugging -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading AR Experience...</p>
    <p style="font-size: 14px; margin-top: 10px;">Please allow camera access</p>
  </div>

  <!-- A-Frame Scene with MindAR -->
  <a-scene mindar-face embedded color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Camera -->
    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 1 1"></a-entity>
    <a-entity light="type: hemisphere; intensity: 1"></a-entity>

    <!-- Face Anchor (nose bridge - anchor 168) -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <!-- Face Occluder - This hides temple arms behind the face -->
      <a-entity mindar-face-occluder material="colorWrite: false"></a-entity>

      <!-- Glasses Model with Smooth Tracking -->
      <a-gltf-model id="glasses" src="glasses.glb" crossorigin="anonymous" position="0 -0.060 0.015"
        rotation="-5 0 0" scale="0.65 0.65 0.65"
        animation="property: rotation; to: -5 0 0; dur: 100; easing: easeOutQuad; loop: false">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    // Debug: Log URLs
    console.log('📍 Page URL:', window.location.href);
    console.log('📁 Model path: glasses.glb');

    // Custom smooth tracking component
    AFRAME.registerComponent('smooth-track', {
      schema: {
        factor: { type: 'number', default: 0.15 }
      },

      init: function () {
        this.lastPos = new THREE.Vector3();
        this.lastRot = new THREE.Quaternion();
        this.lastScale = new THREE.Vector3(1, 1, 1);
      },

      tick: function () {
        const obj = this.el.object3D;
        const parent = obj.parent;

        if (!parent) return;

        // Smooth position with offset
        this.lastPos.lerp(parent.position, this.data.factor);
        obj.position.copy(this.lastPos);
        // Apply position offset for proper nose bridge placement
        obj.position.y -= 0.060;
        obj.position.z += 0.015;

        // Smooth rotation
        this.lastRot.slerp(parent.quaternion, this.data.factor);
        obj.quaternion.copy(this.lastRot);

        // Smooth scale
        this.lastScale.lerp(parent.scale, this.data.factor * 0.8);
        const baseScale = 0.65;
        obj.scale.set(
          baseScale * this.lastScale.x,
          baseScale * this.lastScale.y,
          baseScale * this.lastScale.z
        );
      }
    });

    // Apply smooth tracking to glasses
    setTimeout(() => {
      const glasses = document.querySelector('#glasses');
      if (glasses) {
        glasses.setAttribute('smooth-track', 'factor: 0.22');
      }
    }, 2000);

    // Hide loading screen when AR starts
    const scene = document.querySelector('a-scene');

    scene.addEventListener('loaded', () => {
      console.log('✅ Scene loaded');
      setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
    });

    scene.addEventListener('renderstart', () => {
      const loading = document.getElementById('loading');
      if (loading) {
        setTimeout(() => {
          loading.style.display = 'none';
          window.dispatchEvent(new Event('resize'));
          setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
          setTimeout(() => window.dispatchEvent(new Event('resize')), 500);
          setTimeout(() => window.dispatchEvent(new Event('resize')), 1000);
        }, 1000);
      }
    });

    scene.addEventListener('arReady', () => {
      console.log('✅ AR Ready - Face tracking started');

      const canvas = document.querySelector('canvas');
      if (canvas) {
        console.log('📱 Forcing canvas refresh...');
        canvas.style.display = 'none';
        setTimeout(() => {
          canvas.style.display = 'block';
        }, 10);
      }

      setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
      setTimeout(() => window.dispatchEvent(new Event('resize')), 500);
      setTimeout(() => window.dispatchEvent(new Event('resize')), 1000);

      setTimeout(() => {
        const glasses = document.querySelector('#glasses');
        if (glasses) {
          console.log('👓 Glasses element found, forcing visibility');
          glasses.setAttribute('visible', 'true');
        } else {
          console.error('❌ Glasses element not found!');
        }
      }, 1500);
    });

    scene.addEventListener('arError', (event) => {
      console.error('❌ AR Error:', event.detail);
    });

    const glassesModel = document.querySelector('#glasses');
    if (glassesModel) {
      glassesModel.addEventListener('model-loaded', () => {
        console.log('✅ Glasses model loaded successfully');
        console.log('Model position:', glassesModel.getAttribute('position'));
        console.log('Model scale:', glassesModel.getAttribute('scale'));
        console.log('Model visible:', glassesModel.getAttribute('visible'));

        setTimeout(() => {
          const object3D = glassesModel.object3D;
          if (object3D) {
            console.log('👓 Object3D children count:', object3D.children.length);
            console.log('👓 Object3D visible:', object3D.visible);
          }
        }, 500);
      });

      glassesModel.addEventListener('model-error', (event) => {
        console.error('❌ Glasses model error:', event.detail);
      });
    } else {
      console.error('❌ Glasses model element not found in DOM');
    }
  </script>
</body>

</html>
